# Dependabot configuration — https://docs.github.com/en/code-security/dependabot
#
# Keeps Go modules and GitHub Actions used by this repo up to date. Weekly
# cadence is enough for security-relevant drift; security updates are
# opened immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Batch non-security patch/minor updates into one PR per ecosystem
      # so the review queue doesn't get 20 tiny bumps per week.
      gomod-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
