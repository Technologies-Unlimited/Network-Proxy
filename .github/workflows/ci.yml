name: CI

# Standing health gate for Network-Monitor. Runs on every push and PR.
# ubuntu-latest ships gcc, so the RACE DETECTOR runs here (it can't on the
# cgo-less Windows dev box) — this is where `go test -race` lives.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build / vet / test-race / lint / vuln
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # THE race gate. This app has collectors, tickers, background sweeps and
      # shared session state; data races are a real usability class and this is
      # the only place they can be detected (needs cgo).
      - name: go test -race
        run: go test -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
