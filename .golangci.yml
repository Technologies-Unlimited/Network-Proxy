# golangci-lint v2 configuration for Network-Monitor.
#
# Curated for USABILITY/CORRECTNESS, not style. Every linter here catches a way
# the running product can silently misbehave for its operator. Pure-style
# linters (gofmt, lll, gocyclo, godot, whitespace, ...) are deliberately NOT
# enabled — this repo is not gofmt-clean and we want correctness signal, not
# formatting churn.
#
# Run locally via `bash scripts/check.sh`; CI runs it on every push/PR.
version: "2"

run:
  timeout: 5m

linters:
  # Start from nothing and opt in deliberately, so the set is exactly what we
  # reviewed rather than whatever the tool defaults to this release.
  default: none
  enable:
    - errcheck # swallowed errors = silent failure (the #1 usability class here)
    - govet # go vet correctness checks (shadowing, printf, locks, ...)
    - ineffassign # ineffectual assignments: a value computed then discarded
    - staticcheck # SA/ST/S/QF: real bugs, dead code, dubious constructs
    - unconvert # redundant type conversions (often a sign of confused code)
    - wastedassign # assignment whose value is never read (logic that does nothing)
    - bodyclose # unclosed http.Response.Body -> fd/socket leak on a long-running server
    - sqlclosecheck # unclosed sql.Rows/Stmt -> DB resource leak
    - rowserrcheck # unchecked rows.Err() -> silently truncated result set
    - nilerr # `return nil` when err != nil -> endpoint lies that it succeeded
    - durationcheck # multiplying two time.Durations -> wrong timeout/interval
    - contextcheck # passing a non-inherited context -> broken cancellation/deadlines

  settings:
    errcheck:
      exclude-functions:
        # cobra's MarkFlagRequired only errors when the named flag does not
        # exist — a programmer error visible at the same call site, never a
        # runtime condition. Ignoring it is the standard cobra idiom.
        - (*github.com/spf13/cobra.Command).MarkFlagRequired

  exclusions:
    generated: lax
    rules:
      # ------------------------------------------------------------------
      # OUT-OF-SCOPE (style/refactor, not correctness) — legitimate config,
      # not a bug baseline.
      # ------------------------------------------------------------------

      # QF#### are staticcheck "quickfix" STYLE refactors (use a tagged switch,
      # apply De Morgan's law, ...). This gate is correctness/usability, not
      # style, so they are disabled wholesale.
      - linters: [staticcheck]
        text: 'QF1[0-9]{3}'

      # ------------------------------------------------------------------
      # PROVABLY-INTENTIONAL patterns (documented in-code) — narrowly scoped.
      # ------------------------------------------------------------------

      # scanner.go imports github.com/go-ping/ping, deprecated upstream (SA1019).
      # Migrating to the maintained fork (prometheus-community/pro-bing) is a
      # dependency change for a later stage. Scoped to the one file + one check.
      - path: internal/agent/discovery/scanner\.go
        linters: [staticcheck]
        text: 'SA1019'

      # diag_url.go's SSRF guard returns nil on DNS-resolution failure BY DESIGN
      # (documented in-code: a resolution failure is the HTTP layer's problem to
      # report, not this guard's). Intentional fail-open, not a nil-error lie.
      - path: internal/api/diag_url\.go
        linters: [nilerr]

      # StartTest launches the bandwidth test on a DELIBERATELY detached
      # context.Background() so the background test survives the RPC returning;
      # inheriting the request ctx would cancel the test immediately. Intentional.
      - path: internal/grpc/bandwidth\.go
        linters: [contextcheck]

      # errcheck: deferred/cleanup Close() errors are conventionally ignored
      # across the Go ecosystem (net.Conn, *sql.DB, os.File, net.Listener, gRPC
      # conns); nothing actionable can be done with a Close error on a
      # read/cleanup path. NOTE: this is broad — the updater's write-path closes
      # (outFile/destination Close) are listed in 'concerns' for the errcheck
      # burn-down stage to examine, since a failed close there can truncate a
      # downloaded update.
      - linters: [errcheck]
        source: '\.Close\(\)\s*$'

      # errcheck: writes to an http.ResponseWriter / test recorder cannot change
      # the already-sent status or recover mid-body, so the write error is
      # conventionally ignored.
      - linters: [errcheck]
        source: '^\s*(io\.WriteString|fmt\.Fprint(f|ln)?)\('

      # errcheck: test files exercise handlers with fixed inputs where a failed
      # helper write/setenv surfaces as an assertion failure anyway; keep
      # errcheck focused on production silent-failures (permitted by the task).
      - path: _test\.go
        linters: [errcheck]

      # errcheck: net.Conn SetDeadline/SetReadDeadline/SetWriteDeadline. A
      # deadline-set only fails on an already-closed/invalid conn, in which case
      # the very next (checked) Read/Write on that same conn returns the error
      # too, so it is not silently lost. Listed in 'concerns' for a later stage
      # to confirm this holds at every probe call site.
      - linters: [errcheck]
        source: '\.Set(Read|Write)?Deadline\('

      # ------------------------------------------------------------------
      # TIME-BOXED BUG BASELINE — a real bug, deferred to a later stage.
      # Burn this down; do NOT add more entries here.
      # ------------------------------------------------------------------

      # The self-updater swallows os.Rename / os.Remove / os.MkdirAll /
      # fmt.Sscanf errors, INCLUDING the error-recovery renames that restore the
      # old binary — a failed restore leaves the install with NO executable,
      # silently. And a failed os.MkdirAll makes extraction fail without a clear
      # error. These need real error propagation, owned by a later usability
      # stage (see 'concerns' for the exact call sites).
      # TODO(gate-burndown): handle updater fs errors, then remove this exclude.
      - path: internal/updater/updater\.go
        linters: [errcheck]

issues:
  # Report every finding so the baseline count is honest (defaults truncate).
  max-issues-per-linter: 0
  max-same-issues: 0
