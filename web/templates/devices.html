<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - Network Monitor</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Network Monitor</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/devices">Devices</a>
                <a href="/alerts">Alerts</a>
                <a href="/nodes">Nodes</a>
                <a href="/visualize">Visualize</a>
                <a href="/tools">Tools</a>
                <a href="/reports">Reports</a>
                <a href="/settings">Settings</a>
            </nav>
        </header>

        <main>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Device Management</h2>
                <button class="btn btn-primary" onclick="showAddDeviceForm()">+ Add Device</button>
            </div>

            <!-- Add Device Form (hidden by default) -->
            <div id="add-device-form" class="section" style="display: none;">
                <h3>Add New Device</h3>
                <form hx-post="/api/v1/devices" hx-target="#devices-table" hx-swap="outerHTML">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                        <div>
                            <label>Hostname *</label>
                            <input type="text" name="hostname" required style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                        <div>
                            <label>IP Address or FQDN *</label>
                            <input type="text" name="ip_address" required placeholder="e.g., 192.168.1.1 or dns.google" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                            <small style="color: var(--text-secondary); font-size: 11px;">Enter an IP address or fully qualified domain name</small>
                        </div>
                        <div>
                            <label>Device Type</label>
                            <select name="device_type" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                                <option value="router">Router</option>
                                <option value="switch">Switch</option>
                                <option value="server" selected>Server</option>
                                <option value="workstation">Workstation</option>
                                <option value="firewall">Firewall</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label>Location</label>
                            <input type="text" name="location" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label>Description</label>
                            <input type="text" name="description" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <h4 style="margin-bottom: 10px;">ICMP Monitoring</h4>
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <label style="display: flex; align-items: center; gap: 5px;">
                                <input type="checkbox" name="icmp_enabled" checked>
                                <span>Enable ICMP Ping</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 5px;">
                                <span>Interval:</span>
                                <input type="number" name="icmp_interval" value="60" min="10" style="width: 60px; padding: 4px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                                <span>seconds</span>
                            </label>
                        </div>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary">Add Device</button>
                        <button type="button" class="btn btn-secondary" onclick="hideAddDeviceForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Edit Device Form (hidden by default) -->
            <div id="edit-device-form" class="section" style="display: none;">
                <h3>Edit Device</h3>
                <form id="edit-form" hx-put="" hx-target="#devices-table" hx-swap="outerHTML">
                    <input type="hidden" id="edit-device-id" name="id">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                        <div>
                            <label>Hostname *</label>
                            <input type="text" id="edit-hostname" name="hostname" required style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                        <div>
                            <label>IP Address or FQDN *</label>
                            <input type="text" id="edit-ip-address" name="ip_address" required placeholder="e.g., 192.168.1.1 or dns.google" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                        <div>
                            <label>Device Type</label>
                            <select id="edit-device-type" name="device_type" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                                <option value="router">Router</option>
                                <option value="switch">Switch</option>
                                <option value="server">Server</option>
                                <option value="workstation">Workstation</option>
                                <option value="firewall">Firewall</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label>Location</label>
                            <input type="text" id="edit-location" name="location" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label>Description</label>
                            <input type="text" id="edit-description" name="description" style="width: 100%; padding: 8px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <h4 style="margin-bottom: 10px;">ICMP Monitoring</h4>
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <label style="display: flex; align-items: center; gap: 5px;">
                                <input type="checkbox" id="edit-icmp-enabled" name="icmp_enabled">
                                <span>Enable ICMP Ping</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 5px;">
                                <span>Interval:</span>
                                <input type="number" id="edit-icmp-interval" name="icmp_interval" value="60" min="10" style="width: 60px; padding: 4px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px;">
                                <span>seconds</span>
                            </label>
                        </div>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" onclick="hideEditDeviceForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Devices Table -->
            <div class="section">
                <div id="devices-table" hx-get="/api/v1/devices" hx-trigger="load, every 10s" hx-swap="innerHTML">
                    Loading devices...
                </div>
            </div>
        </main>

        <footer>
            <p>Network Monitor - Built with Go</p>
        </footer>
    </div>

    <script>
        function showAddDeviceForm() {
            document.getElementById('add-device-form').style.display = 'block';
            document.getElementById('edit-device-form').style.display = 'none';
        }
        function hideAddDeviceForm() {
            document.getElementById('add-device-form').style.display = 'none';
        }

        function showEditDeviceForm(deviceId) {
            // Hide add form
            document.getElementById('add-device-form').style.display = 'none';

            // Fetch device data
            fetch(`/api/v1/devices/${deviceId}`)
                .then(response => response.json())
                .then(data => {
                    const device = data.device;
                    console.log('Device data:', device); // Debug log

                    // Populate form fields - Go JSON uses PascalCase field names
                    document.getElementById('edit-device-id').value = device.ID || '';
                    document.getElementById('edit-hostname').value = device.Hostname || '';
                    document.getElementById('edit-ip-address').value = device.IPAddress || '';
                    document.getElementById('edit-device-type').value = device.DeviceType || 'server';
                    document.getElementById('edit-location').value = device.Location || '';
                    document.getElementById('edit-description').value = device.Description || '';
                    document.getElementById('edit-icmp-enabled').checked = device.ICMPEnabled || false;
                    document.getElementById('edit-icmp-interval').value = device.ICMPInterval || 60;

                    // Set the form action URL
                    document.getElementById('edit-form').setAttribute('hx-put', `/api/v1/devices/${deviceId}`);
                    htmx.process(document.getElementById('edit-form'));

                    // Show edit form
                    document.getElementById('edit-device-form').style.display = 'block';
                    document.getElementById('edit-device-form').scrollIntoView({ behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error fetching device:', error);
                    alert('Failed to load device data');
                });
        }

        function hideEditDeviceForm() {
            document.getElementById('edit-device-form').style.display = 'none';
        }

        function deleteDevice(deviceId, deviceName) {
            if (confirm(`Are you sure you want to delete ${deviceName}?`)) {
                fetch(`/api/v1/devices/${deviceId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    // Refresh the devices table
                    htmx.trigger('#devices-table', 'load');
                })
                .catch(error => {
                    console.error('Error deleting device:', error);
                    alert('Failed to delete device');
                });
            }
        }

        // Handle htmx response
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'devices-table') {
                hideAddDeviceForm();
                hideEditDeviceForm();
            }
        });

    </script>
</body>
</html>
